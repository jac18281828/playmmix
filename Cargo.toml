[package]
name = "playmmix"
version = "0.1.3"
edition = "2024"
description = "Browser playground for the checksmix MMIX interpreter"
license = "BSD-3-Clause"
readme = "README.md"

[dependencies]
yew = { version = "0.23.0", features = ["csr"] }
log = { version = "0.4", features = ["release_max_level_info"] }
wasm-logger = "0.2.0"
checksmix = { version = "0.3", default-features = false }
web-sys = { version = "0.3", features = ["Element", "HtmlElement", "HtmlTextAreaElement"] }
gloo-timers = "0.3"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[profile.release.package."*"]
opt-level = 'z'
strip = true
